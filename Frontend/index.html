<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Configuration Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Report Configuration Editor</h1>
            <p>Update the Master Data Source for Automated Report Generation</p>
        </header>

        <form id="configForm">
            <!-- Global Metadata -->
            <section id="global_metadata">
                <div class="section-header">
                    <h2>Global Metadata</h2>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="project_title">Project Title</label>
                        <input type="text" id="project_title" name="global_metadata.project_title" required>
                    </div>
                    <div class="form-group">
                        <label for="project_subtitle">Project Subtitle</label>
                        <input type="text" id="project_subtitle" name="global_metadata.project_subtitle">
                    </div>
                    <div class="form-group">
                        <label for="domain">Domain</label>
                        <input type="text" id="domain" name="global_metadata.domain">
                    </div>
                    <div class="form-group">
                        <label for="academic_year">Academic Year</label>
                        <input type="text" id="academic_year" name="global_metadata.academic_year">
                    </div>
                    <div class="form-group">
                        <label for="semester">Semester</label>
                        <input type="text" id="semester" name="global_metadata.semester">
                    </div>
                    <div class="form-group">
                        <label for="college_name">College Name</label>
                        <input type="text" id="college_name" name="global_metadata.college_name">
                    </div>
                    <div class="form-group">
                        <label for="department_name">Department Name</label>
                        <input type="text" id="department_name" name="global_metadata.department_name">
                    </div>
                    <div class="form-group">
                        <label for="department_abbr">Dept Abbr</label>
                        <input type="text" id="department_abbr" name="global_metadata.department_abbr">
                    </div>
                     <div class="form-group">
                        <label for="department_short">Dept Short Name</label>
                        <input type="text" id="department_short" name="global_metadata.department_short">
                    </div>
                    <div class="form-group">
                        <label for="city_code">City Code</label>
                        <input type="text" id="city_code" name="global_metadata.city_code">
                    </div>
                    <div class="form-group">
                        <label for="pincode">Pincode</label>
                        <input type="text" id="pincode" name="global_metadata.pincode">
                    </div>
                    <div class="form-group">
                        <label for="college_address">College Address</label>
                        <input type="text" id="college_address" name="global_metadata.college_address">
                    </div>
                    <div class="form-group">
                        <label for="project_type_meta">Project Type</label>
                        <input type="text" id="project_type_meta" name="global_metadata.project_type">
                    </div>
                </div>
            </section>

            <!-- Styles -->
            <section id="styles">
                <div class="section-header">
                    <h2>Font Styles (Font Size)</h2>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="style_project_title">Project Title Size</label>
                        <input type="number" id="style_project_title" name="styles.project_title">
                    </div>
                    <div class="form-group">
                        <label for="style_project_subtitle">Project Subtitle Size</label>
                        <input type="number" id="style_project_subtitle" name="styles.project_subtitle">
                    </div>
                     <div class="form-group">
                        <label for="style_student_details">Student Details Size</label>
                        <input type="number" id="style_student_details" name="styles.student_details">
                    </div>
                    <div class="form-group">
                        <label for="style_guide_name">Guide Name Size</label>
                        <input type="number" id="style_guide_name" name="styles.guide_name">
                    </div>
                    <div class="form-group">
                        <label for="style_guide_label">Guide Label Size</label>
                        <input type="number" id="style_guide_label" name="styles.guide_label">
                    </div>
                    <div class="form-group">
                        <label for="style_header_footer">Header/Footer Size</label>
                        <input type="number" id="style_header_footer" name="styles.header_footer">
                    </div>
                </div>
            </section>

             <!-- Submission Info -->
             <section id="submission_info">
                <div class="section-header">
                    <h2>Submission Info</h2>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="sub_date">Date</label>
                        <input type="text" id="sub_date" name="submission_info.date">
                    </div>
                    <div class="form-group">
                        <label for="sub_place">Place</label>
                        <input type="text" id="sub_place" name="submission_info.place">
                    </div>
                    <div class="form-group">
                        <label for="sub_year_range">Academic Year Range</label>
                        <input type="text" id="sub_year_range" name="submission_info.academic_year_range">
                    </div>
                </div>
            </section>

            <!-- Students -->
            <section id="students_section">
                <div class="section-header">
                    <h2>Students</h2>
                </div>
                <div id="students_container" class="array-container">
                    <!-- Students will be injected here JS -->
                </div>
            </section>

             <!-- Guide -->
             <section id="guide_section">
                <div class="section-header">
                    <h2>Internal Guide</h2>
                </div>
                <div id="guide_container" class="array-container">
                    <!-- Guide will be injected here JS -->
                </div>
            </section>

            <!-- Approvers -->
            <section id="approvers">
                <div class="section-header">
                    <h2>Approvers</h2>
                </div>
                <div class="form-grid">
                    <!-- HOD -->
                    <div class="array-item">
                        <h4>HOD</h4>
                         <div class="form-group">
                            <label>Name</label>
                            <input type="text" name="people.approvers.hod.name">
                        </div>
                         <div class="form-group">
                            <label>Designation</label>
                            <input type="text" name="people.approvers.hod.designation">
                        </div>
                         <div class="form-group">
                            <label>Department</label>
                            <input type="text" name="people.approvers.hod.department">
                        </div>
                    </div>
                    <!-- Dean -->
                     <div class="array-item">
                        <h4>Dean</h4>
                         <div class="form-group">
                            <label>Name</label>
                            <input type="text" name="people.approvers.dean.name">
                        </div>
                         <div class="form-group">
                            <label>Designation</label>
                            <input type="text" name="people.approvers.dean.designation">
                        </div>
                         <div class="form-group">
                            <label>School</label>
                            <input type="text" name="people.approvers.dean.school">
                        </div>
                    </div>
                    <!-- Principal -->
                    <div class="array-item">
                        <h4>Principal</h4>
                         <div class="form-group">
                            <label>Name</label>
                            <input type="text" name="people.approvers.principal.name">
                        </div>
                         <div class="form-group">
                            <label>Designation</label>
                            <input type="text" name="people.approvers.principal.designation">
                        </div>
                    </div>
                    <!-- COE -->
                     <div class="array-item">
                        <h4>COE</h4>
                         <div class="form-group">
                            <label>Name</label>
                            <input type="text" name="people.approvers.COE.name">
                        </div>
                    </div>
                </div>
            </section>

            <!-- Certificate Info -->
            <section id="certificate_info">
                <div class="section-header">
                    <h2>Certificate Info</h2>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="cert_project_type">Project Type</label>
                         <input type="text" id="cert_project_type" name="certificate_info.project_type">
                    </div>
                    <div class="form-group">
                        <label for="cert_title">Title</label>
                         <input type="text" id="cert_title" name="certificate_info.certificate_title">
                    </div>
                    <div class="form-group">
                        <label for="cert_guide_name">Guide Name</label>
                         <input type="text" id="cert_guide_name" name="certificate_info.guide_name">
                    </div>
                    <div class="form-group">
                        <label for="cert_guide_desig">Guide Designation</label>
                         <textarea id="cert_guide_desig" name="certificate_info.guide_designation"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="cert_hod_name">HOD Name</label>
                         <input type="text" id="cert_hod_name" name="certificate_info.hod_name">
                    </div>
                     <div class="form-group">
                        <label for="cert_hod_desig">HOD Designation</label>
                         <textarea id="cert_hod_desig" name="certificate_info.hod_designation"></textarea>
                    </div>
                     <div class="form-group">
                        <label for="cert_dean_name">Dean Name</label>
                         <input type="text" id="cert_dean_name" name="certificate_info.dean_name">
                    </div>
                     <div class="form-group">
                        <label for="cert_dean_desig">Dean Designation</label>
                         <textarea id="cert_dean_desig" name="certificate_info.dean_designation"></textarea>
                    </div>
                </div>
            </section>
            
            <!-- Report Content -->
            <section id="report_content">
                <div class="section-header">
                    <h2>Report Content</h2>
                </div>
                <div class="form-grid">
                     <div class="form-group">
                        <label for="abstract_text">Abstract</label>
                        <textarea id="abstract_text" name="report_content.abstract.text" style="min-height: 150px;"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="ack_text">Acknowledgement Standard Text</label>
                        <textarea id="ack_text" name="report_content.acknowledgement.standard_text" style="min-height: 150px;"></textarea>
                    </div>
                     <div class="form-group">
                        <label for="decl_text">Declaration Text</label>
                        <textarea id="decl_text" name="report_content.declaration.text" style="min-height: 150px;"></textarea>
                    </div>
                </div>
            </section>


            <div class="sticky-footer">
                <button type="submit" id="saveBtn">Save Configuration</button>
            </div>
        </form>
    </div>

    <div id="status-message"></div>

    <script>
        let currentData = {};

        // Fetch data on load
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/data');
                currentData = await response.json();
                populateForm(currentData);
            } catch (error) {
                showToast('Failed to load data: ' + error.message, 'error');
            }
        });

        function populateForm(data) {
            // Helper to set value by name
            const setVal = (name, val) => {
                const el = document.querySelector(`[name="${name}"]`);
                if (el) el.value = val;
            };

            // Global Metadata
            for (const [key, value] of Object.entries(data.global_metadata || {})) {
                setVal(`global_metadata.${key}`, value);
            }

            // Styles
            for (const [key, value] of Object.entries(data.styles || {})) {
                setVal(`styles.${key}`, value);
            }

            // Submission Info
            for (const [key, value] of Object.entries(data.submission_info || {})) {
                setVal(`submission_info.${key}`, value);
            }

             // Approvers (Nested manually in HTML so just populate)
             if (data.people && data.people.approvers) {
                const app = data.people.approvers;
                if(app.hod) {
                    setVal('people.approvers.hod.name', app.hod.name);
                    setVal('people.approvers.hod.designation', app.hod.designation);
                    setVal('people.approvers.hod.department', app.hod.department);
                }
                if(app.dean) {
                    setVal('people.approvers.dean.name', app.dean.name);
                    setVal('people.approvers.dean.designation', app.dean.designation);
                    setVal('people.approvers.dean.school', app.dean.school);
                }
                 if(app.principal) {
                    setVal('people.approvers.principal.name', app.principal.name);
                    setVal('people.approvers.principal.designation', app.principal.designation);
                }
                 if(app.COE) {
                    setVal('people.approvers.COE.name', app.COE.name);
                }
             }

             // Certificate Info
            for (const [key, value] of Object.entries(data.certificate_info || {})) {
                setVal(`certificate_info.${key}`, value);
            }

             // Report Content
             if (data.report_content) {
                 if (data.report_content.abstract) setVal('report_content.abstract.text', data.report_content.abstract.text);
                 if (data.report_content.acknowledgement) setVal('report_content.acknowledgement.standard_text', data.report_content.acknowledgement.standard_text);
                 if (data.report_content.declaration) setVal('report_content.declaration.text', data.report_content.declaration.text);
             }

             // Arrays (Students & Guide) - Dynamic Generation
             renderStudents(data.people?.students || []);
             renderGuide(data.people?.guide || []);
        }

        function renderStudents(students) {
            const container = document.getElementById('students_container');
            container.innerHTML = '';
            
            students.forEach((student, index) => {
                const div = document.createElement('div');
                div.className = 'array-item';
                div.innerHTML = `
                    <h4>Student ${index + 1}</h4>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>USN</label>
                            <input type="text" class="student-usn" value="${student.usn}" onchange="updateStudent(${index}, 'usn', this.value)">
                        </div>
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" class="student-name" value="${student.name}" onchange="updateStudent(${index}, 'name', this.value)">
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function renderGuide(guides) {
            const container = document.getElementById('guide_container');
            container.innerHTML = '';
            
            guides.forEach((guide, index) => {
                const div = document.createElement('div');
                div.className = 'array-item';
                div.innerHTML = `
                    <h4>Guide ${index + 1}</h4>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" value="${guide.name}" onchange="updateGuide(${index}, 'name', this.value)">
                        </div>
                        <div class="form-group">
                            <label>Designation</label>
                            <input type="text" value="${guide.designation}" onchange="updateGuide(${index}, 'designation', this.value)">
                        </div>
                         <div class="form-group">
                            <label>Department</label>
                            <input type="text" value="${guide.department}" onchange="updateGuide(${index}, 'department', this.value)">
                        </div>
                         <div class="form-group">
                            <label>Role</label>
                            <input type="text" value="${guide.role}" onchange="updateGuide(${index}, 'role', this.value)">
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // Live update for arrays since they are not standard form inputs
        window.updateStudent = (index, key, value) => {
             if (!currentData.people.students[index]) return;
             currentData.people.students[index][key] = value;
        };

        window.updateGuide = (index, key, value) => {
             if (!currentData.people.guide[index]) return;
             currentData.people.guide[index][key] = value;
        };

        // Handle Save
        document.getElementById('configForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            // Reconstruct JSON from flat form data
            // We use the currentData as base to preserve any structure we missed (though we covered all)
            // and update it with form values.
            
            const newData = JSON.parse(JSON.stringify(currentData)); // deep copy

            // Utility to set nested path
            const setPath = (obj, path, val) => {
                const keys = path.split('.');
                let current = obj;
                for (let i = 0; i < keys.length - 1; i++) {
                    if (!current[keys[i]]) current[keys[i]] = {};
                    current = current[keys[i]];
                }
                current[keys[keys.length - 1]] = val;
            };

            for (const [name, value] of formData.entries()) {
                // Special handling for styles to ensure they are integers
                if (name.startsWith('styles.')) {
                    setPath(newData, name, parseInt(value, 10));
                } else if (name.includes('.')) {
                    setPath(newData, name, value);
                }
            }

            // Note: Arrays (students/guides) are already updated in newData via live listeners on currentData 
            // because we deep copied currentData which was modified by window.updateStudent/updateGuide

            try {
                const response = await fetch('/api/data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newData)
                });
                
                const result = await response.json();
                if (result.status === 'success') {
                    showToast('Configuration saved successfully!', 'success');
                } else {
                    showToast('Error saving: ' + result.message, 'error');
                }
            } catch (error) {
                showToast('Network error: ' + error.message, 'error');
            }
        });

        function showToast(message, type) {
            const toast = document.getElementById('status-message');
            toast.textContent = message;
            toast.className = type + ' show-toast';
            setTimeout(() => {
                toast.classList.remove('show-toast');
            }, 3000);
        }

    </script>
</body>
</html>
