version: '3.8'
services:
  root:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
    - 8000:8000
    networks:
    - app-network
    restart: unless-stopped
  Frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    ports:
    - 3001:3000
    networks:
    - app-network
    restart: unless-stopped
  backend_flask:
    build:
      context: .
      dockerfile: backend_flask/Dockerfile
    ports:
    - 8002:8000
    networks:
    - app-network
    restart: unless-stopped
  v2_architecture:
    build:
      context: .
      dockerfile: backend/scripts/v2_architecture/Dockerfile
    ports:
    - 8003:8000
    networks:
    - app-network
    restart: unless-stopped
networks:
  app-network:
    driver: bridge
